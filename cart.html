<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/logo1.png" type="image/png" />
    <link rel="icon" href="./image/favicon.jpg" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/d8bf65372b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/components.css" />
    <title>Shopping Cart</title>
    <style>
      .cart-item {
        border-bottom: 1px solid #eee;
        padding: 20px 0;
      }
      .cart-item img {
        max-width: 100px;
        height: auto;
      }
      .quantity-btn {
        background: #03346f;
        border: none;
        color: white;
        padding: 5px 10px;
        margin: 0 5px;
      }
      .remove-btn {
        color: #dc3545;
        cursor: pointer;
      }
      .cart-summary {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 5px;
      }
      .checkout-btn {
        background: #a18e7f;
        border: none;
        width: 100%;
        padding: 10px;
        color: white;
        font-weight: bold;
      }
      .checkout-btn:hover {
        opacity: 0.9;
      }
      .checkout-btn.disabled {
        background: #cccccc;
        cursor: not-allowed;
      }
      .policy-reminder {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #dc3545;
      }
      .policy-accepted {
        margin-top: 10px;
        font-size: 0.9rem;
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="site-navbar"></div>

    <section class="container my-5 py-5">
      <h2 class="text-center mb-4">Your Shopping Cart</h2>
      <div class="row">
        <div class="col-md-8">
          <div id="cart-items"></div>
        </div>
        <div class="col-md-4">
          <div class="cart-summary">
            <h4>Order Summary</h4>
            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal:</span>
              <span id="subtotal">R0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Shipping:</span>
              <span>R0.00</span>
            </div>
            <hr />
            <div class="d-flex justify-content-between mb-4">
              <strong>Total:</strong>
              <strong id="total">R0.00</strong>
            </div>
            <div class="mb-3">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="policyCheckbox"
                  disabled
                />
                <label class="form-check-label" for="policyCheckbox">
                  <a href="policy.html"
                    >Accept our Ordering and Payment Policy</a
                  >
                </label>
              </div>
              <div id="policyStatus" class="policy-reminder">
                Please read and accept our policy before checkout
              </div>
            </div>
            <button
              id="checkoutBtn"
              class="checkout-btn disabled"
              type="button"
              disabled
            >
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER SECTION START -->
    <!-- SHARED FOOTER -->
    <div id="site-footer"></div>

    <script src="./js/components.js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/cart.js"></script>
  </body>
</html>
