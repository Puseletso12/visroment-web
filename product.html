<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="icon" href="images/logo1.png" type="image/png" />
    <script
      src="https://kit.fontawesome.com/d8bf65372b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="image/favicon.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="./style/style.css " />
    <link rel="stylesheet" href="./style/components.css" />
    <title src>Product Page</title>

    <style>
      .small-img-group {
        display: flex;
        justify-content: space-between;
      }
      .small-img-col {
        flex-basis: 24%;
        cursor: pointer;
      }
      .sproduct select {
        display: block;
        padding: 5px 10px;
      }
      .sproduct input {
        width: 50px;
        height: 40px;
        padding-left: 10px;
        font-size: 16px;
        margin-right: 10px;
      }
      .sproduct input:focus {
        outline: none;
      }
      .btn {
        background-color: #03346f;
        opacity: 1;
        transition: 0.3s ease;
      }
      .btn:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="site-navbar"></div>

    <section class="sproduct my-5 pt-5 container" id="product-details">
      <div class="row">
        <!-- Product images -->

        <div class="col-lg-5 col-md-12 col-12">
          <img class="img-fluid w-100 pd-1" id="mainImg" alt="Product image" />

          <div id="productGallery" class="product-gallery"></div>
        </div>

        <!-- Product information -->

        <div class="col-lg-6 col-md-12 col-12">
          <h6 id="product-category"></h6>

          <h3 class="py-4" id="product-name"></h3>

          <h2 id="product-price"></h2>

          <select class="my-4" id="product-size" aria-label="Product size">
            <option value="">Select Size</option>
            <option value="XL">XL</option>
            <option value="Large">Large</option>
            <option value="Medium">Medium</option>
            <option value="Small">Small</option>
            <option value="XS">XS</option>
            <option value="XXS">XXS</option>
          </select>

          <input
            type="number"
            id="product-quantity"
            aria-label="Quantity"
            value="1"
            min="1"
            max="99"
            step="1"
          />

          <button class="btn" id="add-to-cart" type="button">
            Add to Cart
          </button>

          <h4 class="mt-5 mb-5">Product Details</h4>

          <span id="product-description"></span>
        </div>
      </div>
    </section>

    <!-- SHARED FOOTER -->
    <div id="site-footer"></div>

    <script src="./js/index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>

    <script src="./js/components.js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/product-details.js"></script>
  </body>
</html>
