<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="shortcut icon" href="image/favicon.jpg" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/d8bf65372b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style/style.css " />
    <link rel="stylesheet" href="./style/components.css" />
    <title src>Shop</title>

    <style>
      .product img {
        width: 500%;
        height: auto;
        box-sizing: border-box;
        object-fit: cover;
      }

      #feature
        > div.row.mx-auto.container
        > nav
        > ul
        > li.page-item.active
        > a {
        background-color: black;
        border: none;
      }

      #feature > nav > ul > li.page-item.active > a {
        background-color: black;
      }

      #feature
        > div.row.mx-auto.container
        > nav
        > ul
        > li:nth-last-child(n):hover
        > a {
        background-color: #a18e7f;
        color: #fff;
      }

      .pagination a {
        color: black;
      }

      .f {
        display: flex;
        justify-content: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- ── NAVBAR (your existing Bootstrap navbar, unchanged) ── -->
    <div id="site-navbar"></div>

    <section id="feature" class="my-5 py-5">
      <div class="container mt-5 py-5">
        <h2 class="font-weight-bold"></h2>
        <p></p>
      </div>

      <div id="shop-products" class="row mx-auto container"></div>
    </section>

    <!-- SHARED FOOTER -->
    <div id="site-footer"></div>

    <script src="./js/components.js"></script>
    <script src="./js/products.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/catalogue.js"></script>
  </body>
</html>
